[project]
name = "intro-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

dependencies = [
    "fastapi>=0.139.2",
    "langchain>=1.3.14",
    "langgraph>=1.2.9",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "langgraph-cli[inmem]>=0.4.14",
    "pytest>=9.1.1",
    "rich>=15.0.0",
]
